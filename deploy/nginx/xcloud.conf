# xCloud Nginx edge router
#
# Two internal upstreams, one public origin:
#   /api and /api/*  -> Go backend   (API owner: authentication, authorization, business API)
#   everything else  -> Next.js UI   (UI rendering + protected-page navigation guard only)
#
# Internal services are loopback-bound. The browser only ever talks to this edge.
# HTTP only on the internal network; see the commented HTTPS template at the bottom.

upstream xcloud_next {
    server 127.0.0.1:13333;
    keepalive 16;
}

upstream xcloud_go {
    server 127.0.0.1:18888;
    keepalive 32;
}

# Rate limit: 10 req/s per IP for API, 30 req/s for pages
limit_req_zone $binary_remote_addr zone=xcloud_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=xcloud_page:10m rate=30r/s;

server {
    listen 80;
    server_name _;

    # Security headers (Nginx-level, independent of Next.js)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Max upload size (CSV import and bulk bodies)
    client_max_body_size 10m;

    # --- API boundary -------------------------------------------------------
    # Exact /api must not fall through to the UI upstream.
    location = /api {
        limit_req zone=xcloud_api burst=20 nodelay;
        proxy_pass http://xcloud_go;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Identity headers are never trusted from the client. Go derives the
        # principal from the auth_token cookie exclusively.
        proxy_set_header X-User "";
        proxy_set_header X-Role "";
        proxy_set_header X-Permissions "";
    }

    # Server-sent events: streamed, never buffered.
    location = /api/notifications/stream {
        limit_req zone=xcloud_api burst=20 nodelay;
        proxy_pass http://xcloud_go;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User "";
        proxy_set_header X-Role "";
        proxy_set_header X-Permissions "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    location /api/ {
        limit_req zone=xcloud_api burst=20 nodelay;
        proxy_pass http://xcloud_go;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User "";
        proxy_set_header X-Role "";
        proxy_set_header X-Permissions "";
    }

    # --- Next.js development transport (HMR) --------------------------------
    # The Next.js development server delivers its framework HMR WebSocket under the
    # framework namespace `/_next/hmr` (Next.js 16; renamed from `/_next/webpack-hmr`).
    # `location /` clears the Connection header for upstream keepalive, which makes an
    # upgrade request arrive as a plain GET and be answered by the UI guard instead of
    # the HMR handler. This location is development transport only: it never matches
    # /api or /api/*, which stay exclusive to the Go upstream, and it is inert under
    # `next start` (no HMR server is registered in production).
    location /_next/hmr {
        proxy_pass http://xcloud_next;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- UI boundary --------------------------------------------------------
    # Never buffered-off globally; only the SSE location needs that.
    location / {
        limit_req zone=xcloud_page burst=50 nodelay;
        proxy_pass http://xcloud_next;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}


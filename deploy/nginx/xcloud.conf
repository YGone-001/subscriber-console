# xCloud Nginx reverse proxy
# Internal network — HTTP only. For HTTPS, see the commented block below.

upstream xcloud_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

# Rate limit: 10 req/s per IP for API, 30 req/s for pages
limit_req_zone $binary_remote_addr zone=xcloud_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=xcloud_page:10m rate=30r/s;

server {
    listen 80;
    server_name _;

    # Security headers (Nginx-level, independent of Next.js)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Max upload size (for CSV import)
    client_max_body_size 10m;

    # Static assets — Nginx serves directly, bypasses Node.js
    location /_next/static/ {
        alias /usr/local/src/claudeWorkSpace/subscriber-console/.next/static/;
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Public assets
    location /images/ {
        alias /usr/local/src/claudeWorkSpace/subscriber-console/public/images/;
        expires 30d;
        access_log off;
    }

    # API endpoints — tighter rate limit
    location /api/ {
        limit_req zone=xcloud_api burst=20 nodelay;
        proxy_pass http://xcloud_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # All other requests — pages, login, etc.
    location / {
        limit_req zone=xcloud_page burst=50 nodelay;
        proxy_pass http://xcloud_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}


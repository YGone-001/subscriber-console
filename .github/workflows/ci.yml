name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  node:
    name: Node quality gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/xcloud
      MONGODB_XCLOUD_DB: xcloud
      JWT_SECRET: ci-only-placeholder-secret-with-at-least-32-bytes
      INITIAL_ADMIN_PASSWORD: ChangeMe@2026
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install repository script dependencies
        working-directory: .
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Migration inventory
        run: node ../scripts/migration/inventory-api.mjs

      - name: Migration validator
        run: node ../scripts/migration/validate-inventory.mjs

      - name: Phase 8 backend removal readiness
        run: node ../scripts/test-phase-8-backend-removal-readiness.mjs

  go:
    name: Go backend quality gates
    runs-on: ubuntu-latest
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017
    defaults:
      run:
        working-directory: backend
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

      - name: Build
        run: go build -o /dev/null ./...

  direct-operations:
    name: Direct operations integration
    runs-on: ubuntu-latest
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/xcloud
      MONGODB_XCLOUD_DB: xcloud
      MONGODB_APP_DB: xcloud_ops
      JWT_SECRET: ci-only-placeholder-secret-with-at-least-32-bytes
      INITIAL_ADMIN_PASSWORD: ChangeMe@2026
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Install dependencies
        run: |
          npm ci
          cd frontend && npm ci

      - name: Governance surface removal contract
        run: node scripts/test-direct-operations.mjs

      - name: OCS management suite
        run: node scripts/test-ocs-management-suite.mjs

      - name: RBAC simplification acceptance
        run: node scripts/test-rbac-simplification.mjs

      - name: RBAC role migration acceptance
        run: node scripts/test-rbac-role-migration.mjs

      - name: User management controlled cutover
        run: node scripts/test-user-management-cutover.mjs

      - name: Authentication controlled cutover
        run: node scripts/test-auth-cutover.mjs

      - name: Authentication & User Management UI integration
        run: node scripts/test-auth-user-ui-integration.mjs

  user-management-e2e:
    name: User management HTTP integration
    runs-on: ubuntu-latest
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/xcloud
      MONGODB_XCLOUD_DB: xcloud
      MONGODB_APP_DB: xcloud_ops
      JWT_SECRET: ci-only-placeholder-secret-with-at-least-32-bytes
      INITIAL_ADMIN_PASSWORD: ChangeMe@2026
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Install dependencies
        run: |
          npm ci
          cd frontend && npm ci

      - name: User management HTTP E2E
        run: node scripts/test-user-management-e2e.mjs

  auth-cutover:
    name: Authentication controlled cutover
    runs-on: ubuntu-latest
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/xcloud
      MONGODB_XCLOUD_DB: xcloud
      MONGODB_APP_DB: xcloud_ops
      JWT_SECRET: ci-only-placeholder-secret-with-at-least-32-bytes
      INITIAL_ADMIN_PASSWORD: ChangeMe@2026
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Install dependencies
        run: |
          npm ci
          cd frontend && npm ci

      - name: Authentication controlled cutover
        run: node scripts/test-auth-cutover.mjs

  deployment-boundary:
    name: Phase 8.5 proxy / deployment boundary finalization
    runs-on: ubuntu-latest
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017
      MONGODB_XCLOUD_DB: xcloud
      MONGODB_APP_DB: xcloud_ops
      JWT_SECRET: ci-only-placeholder-secret-with-at-least-32-bytes
      INITIAL_ADMIN_PASSWORD: ChangeMe@2026
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Install dependencies
        run: |
          npm ci
          cd frontend && npm ci

      - name: Install Nginx
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx
          sudo systemctl stop nginx || true
          sudo pkill -x nginx || true
          echo "PHASE85_NGINX_BIN=$(command -v nginx)" >> "$GITHUB_ENV"
          nginx -v

      - name: Validate the repository Nginx configuration
        run: |
          set -euo pipefail
          PREFIX="$(mktemp -d)"
          mkdir -p "$PREFIX/conf" "$PREFIX/logs" "$PREFIX/temp"
          printf 'types { text/html html; text/css css; application/javascript js; }\n' > "$PREFIX/conf/mime.types"
          {
            # The runner user cannot write the distribution's compiled-in pid path
            # (/run/nginx.pid), so both the pid file and the error log are redirected
            # into the sandbox prefix before the package config is included.
            echo "pid $PREFIX/logs/nginx.pid;"
            echo "error_log $PREFIX/logs/error.log notice;"
            echo 'events { worker_connections 128; }'
            echo 'http {'
            echo "  include $PREFIX/conf/mime.types;"
            cat deploy/nginx/xcloud.conf
            echo '}'
          } > "$PREFIX/conf/xcloud.conf"
          nginx -t -p "$PREFIX" -c "$PREFIX/conf/xcloud.conf"

      - name: Build frontend for the real Next.js production runtime proof
        working-directory: frontend
        run: npm run build

      - name: Phase 8.5 proxy / deployment boundary acceptance
        run: node scripts/test-phase-8-deployment-boundary.mjs

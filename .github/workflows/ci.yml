        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Install dependencies
        run: |
          npm ci
          cd frontend && npm ci

      # Real MongoDB 7, the production index initializer, a real Go backend and
      # real HTTP requests against isolated test databases. Proves the edge
      # collection, the partial unique active-edge index, referential integrity,
      # CAS, terminal retirement, retired-tuple recreation, one-hop neighbour
      # projection, RBAC, audit before/after, and rejected-mutation silence.
      - name: Topology foundation integration
        run: node scripts/test-topology-foundation.mjs

  topology-ui-acceptance:
    name: Topology UI/UX acceptance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          cd frontend && npm ci

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      # Pinned development-only browser dependency. Chromium is installed with
      # its system libraries so the screenshot acceptance runs deterministically
      # on the runner image.
      - name: Install Chromium browser dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # Contract and security evidence: two Topology routes, seven Topology APIs,
      # 30 canonical routes, 109 Go registrations, request-contract exactness with
      # negative sentinels, and no raw fetch / absolute URL / retry / executor.
      - name: Topology contract and security evidence
        run: node scripts/test-topology-contract.mjs

      # Native-module integration: routes, navigation, sidebar, breadcrumbs,
      # command palette, shared primitives, shared token system, unchanged shell,
      # no independent theme system, no parallel navigation registry, no
      # hardcoded production nodes and no false live-health labels.
      - name: Topology UI/UX acceptance contract
        run: node scripts/test-topology-ui-contract.mjs

      # Operator-observable behaviour: relationship list, server-side filtering,
      # cursor paging, resource picker, create, duplicate conflict, metadata
      # update, stale revision, retire confirmation, read-only controls, one-hop
      # directions, node and edge selection, empty states, API errors, en/zh.
      - name: Topology frontend behaviour tests
        working-directory: frontend
        run: node tests/run-tests.mjs tests/topology.test.ts

      # Supplemental server-rendered evidence, retained alongside the screenshots.
      - name: Render Topology HTML evidence
        working-directory: frontend
        run: npm run evidence:topology

      # Mandatory browser-rendered acceptance: the built production SPA is served
      # to real Chromium against deterministic API fixtures. Captures the 24-PNG
      # matrix, verifies PNG integrity and SHA-256 checksums, asserts the
      # operator-observable behaviour, and fails closed on any browser error,
      # missing screenshot, unexpected API request or layout regression.
      - name: Browser screenshot acceptance
        working-directory: frontend
        run: npm run acceptance:topology-screenshots

      - name: Upload Topology screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: topology-ui-screenshots
          path: reports/ops/topology-ui-screenshots
          if-no-files-found: error
          retention-days: 14

      - name: Upload Topology HTML evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: topology-ui-evidence
          path: reports/ops/topology-evidence
          if-no-files-found: warn
          retention-days: 14


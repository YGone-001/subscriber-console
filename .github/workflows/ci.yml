      - name: NF discovery contract and security evidence
        run: node scripts/test-nf-discovery-contract.mjs

      # Real MongoDB 7, the production index initializer, a real Go backend and
      # a local mock registry over bounded read-only GET requests. Proves CAS,
      # allowlist default-deny, strict JSON, scan semantics, missing inference
      # only from complete scans, link/unlink metadata-only writes and RBAC.

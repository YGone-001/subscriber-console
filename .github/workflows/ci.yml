name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install repository script dependencies
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Dependency security and CI runtime maintenance gates. The audit gate is driven by
      # `npm audit --json` for both dependency trees and fails closed when the advisory
      # service is unavailable; the runtime contract rejects obsolete Node-20 first-party
      # action majors.
      - name: Dependency security
        run: node scripts/test-dependency-security.mjs

      - name: CI runtime contract
        run: node scripts/test-ci-runtime-contract.mjs

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Frontend tests
        working-directory: frontend
        run: npm test

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: UI anti-AI-drift gate
        run: npm run check:ui-anti-ai-drift

      - name: Frontend runtime contract
        run: node scripts/test-frontend-runtime-contract.mjs

      - name: Frontend shared shell contract
        run: node scripts/test-frontend-shell-contract.mjs

      - name: Frontend read contract
        run: node scripts/test-frontend-read-contract.mjs

      - name: Frontend mutation contract
        run: node scripts/test-frontend-mutation-contract.mjs

      - name: Frontend operational contract
        run: node scripts/test-frontend-operational-contract.mjs

      - name: Inventory contract and security evidence
        run: node scripts/test-inventory-contract.mjs

      - name: API ownership invariants
        run: node scripts/test-api-ownership-invariants.mjs

      - name: Frontend runtime boundary
        run: node scripts/test-frontend-runtime-boundary.mjs

      - name: Frontend runtime dependency integrity
        run: node scripts/test-frontend-runtime-dependencies.mjs

  ui-restoration:
    name: Frontend UI restoration contract
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install repository script dependencies
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Proves the historical xCloud operator presentation was forward-ported onto the
      # current React/Vite + Go runtime: shell component structure, header and sidebar
      # composition, command palette, tab bar, breadcrumbs, theme and language switches,
      # user menu, notification presentation, restored brand asset, dashboard
      # presentation, Inventory visual integration, stylesheet architecture, Next
      # absence, frozen route count (28) and frozen Go registration count (109).
      - name: Frontend UI restoration contract
        run: node scripts/test-ui-restoration-contract.mjs

  go-spa-hosting:
    name: Go embedded SPA integration
    runs-on: ubuntu-latest
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/xcloud
      MONGODB_XCLOUD_DB: xcloud
      MONGODB_APP_DB: xcloud_ops
      JWT_SECRET: ci-only-placeholder-secret-with-at-least-32-bytes
      INITIAL_ADMIN_PASSWORD: ChangeMe@2026
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Install dependencies
        run: |
          npm ci
          cd frontend && npm ci

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Stage SPA for Go
        run: node scripts/stage-spa-for-go.mjs

      - name: Go bundled build
        working-directory: backend
        run: go build -o bin/server ./cmd/server

      - name: Go SPA unit tests
        working-directory: backend
        run: go test -v ./internal/spa/...

      - name: Go static SPA hosting contract
        run: node scripts/test-go-spa-hosting-contract.mjs

      - name: Go static SPA hosting runtime
        run: node scripts/test-go-spa-hosting-runtime.mjs

  go:
    name: Go backend quality gates
    runs-on: ubuntu-latest
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017
    defaults:
      run:
        working-directory: backend
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

      - name: Build
        run: go build -o /dev/null ./...


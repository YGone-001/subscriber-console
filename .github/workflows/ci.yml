name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - "feat/**"
      - "fix/**"
      - "chore/**"

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, test, and build
    runs-on: ubuntu-latest
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/open5gs
      MONGODB_DB: open5gs
      JWT_SECRET: ci-only-placeholder-secret-with-at-least-32-bytes
      INITIAL_ADMIN_PASSWORD: ChangeMe@2026
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  go-backend:
    name: Go backend lint, test, and build
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.modified, 'backend/') || github.ref == 'refs/heads/develop'
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: backend

      - name: Test
        run: go test -race -count=1 ./...

      - name: Build
        run: go build -o /dev/null ./...

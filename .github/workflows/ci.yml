name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  node:
    name: Node quality gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/xcloud
      MONGODB_XCLOUD_DB: xcloud
      JWT_SECRET: ci-only-placeholder-secret-with-at-least-32-bytes
      INITIAL_ADMIN_PASSWORD: ChangeMe@2026
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install repository script dependencies
        working-directory: .
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: API ownership invariants
        run: node ../scripts/test-api-ownership-invariants.mjs

      - name: Next backend absence
        run: node ../scripts/test-next-backend-absence.mjs

      - name: Frontend runtime dependency integrity
        run: node ../scripts/test-frontend-runtime-dependencies.mjs

  go:
    name: Go backend quality gates
    runs-on: ubuntu-latest
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017
    defaults:
      run:
        working-directory: backend
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

      - name: Build
        run: go build -o /dev/null ./...

  direct-operations:
    name: Direct operations integration
    runs-on: ubuntu-latest
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/xcloud
      MONGODB_XCLOUD_DB: xcloud
      MONGODB_APP_DB: xcloud_ops
      JWT_SECRET: ci-only-placeholder-secret-with-at-least-32-bytes
      INITIAL_ADMIN_PASSWORD: ChangeMe@2026
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Install dependencies
        run: |
          npm ci
          cd frontend && npm ci

      - name: Governance surface removal contract
        run: node scripts/test-direct-operations.mjs

      - name: OCS management suite
        run: node scripts/test-ocs-management-suite.mjs

      - name: RBAC simplification acceptance
        run: node scripts/test-rbac-simplification.mjs

      - name: RBAC role migration acceptance
        run: node scripts/test-rbac-role-migration.mjs

      - name: User management runtime integration
        run: node scripts/test-user-management-runtime-integration.mjs

      - name: Authentication runtime integration
        run: node scripts/test-authentication-runtime-integration.mjs

      - name: Authentication & User Management UI integration
        run: node scripts/test-auth-user-ui-integration.mjs

  user-management-e2e:
    name: User management HTTP integration
    runs-on: ubuntu-latest
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/xcloud
      MONGODB_XCLOUD_DB: xcloud
      MONGODB_APP_DB: xcloud_ops
      JWT_SECRET: ci-only-placeholder-secret-with-at-least-32-bytes
      INITIAL_ADMIN_PASSWORD: ChangeMe@2026
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Install dependencies
        run: |
          npm ci
          cd frontend && npm ci

      - name: User management HTTP E2E
        run: node scripts/test-user-management-e2e.mjs

  authentication:
    name: Authentication runtime integration
    runs-on: ubuntu-latest
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/xcloud
      MONGODB_XCLOUD_DB: xcloud
      MONGODB_APP_DB: xcloud_ops
      JWT_SECRET: ci-only-placeholder-secret-with-at-least-32-bytes
      INITIAL_ADMIN_PASSWORD: ChangeMe@2026
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Install dependencies
        run: |
          npm ci
          cd frontend && npm ci

      - name: Authentication runtime integration
        run: node scripts/test-authentication-runtime-integration.mjs

  deployment-boundary:
    name: Deployment boundary integration
    runs-on: ubuntu-latest
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017
      MONGODB_XCLOUD_DB: xcloud
      MONGODB_APP_DB: xcloud_ops
      JWT_SECRET: ci-only-placeholder-secret-with-at-least-32-bytes
      INITIAL_ADMIN_PASSWORD: ChangeMe@2026
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Install dependencies
        run: |
          npm ci
          cd frontend && npm ci

      - name: Install Nginx
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx
          sudo systemctl stop nginx || true
          sudo pkill -x nginx || true
          echo "DEPLOYMENT_NGINX_BIN=$(command -v nginx)" >> "$GITHUB_ENV"
          nginx -v

      - name: Validate the repository Nginx configuration
        run: |
          set -euo pipefail
          PREFIX="$(mktemp -d)"
          mkdir -p "$PREFIX/conf" "$PREFIX/logs" "$PREFIX/temp"
          printf 'types { text/html html; text/css css; application/javascript js; }\n' > "$PREFIX/conf/mime.types"
          {
            # The distribution compiles /run/nginx.pid, /var/log/nginx/access.log and
            # /var/lib/nginx/* temp paths, none of which the runner user can write, so
            # every runtime path is redirected into the sandbox prefix before the
            # package configuration is included.
            echo "pid $PREFIX/logs/nginx.pid;"
            echo "error_log $PREFIX/logs/error.log notice;"
            echo 'events { worker_connections 128; }'
            echo 'http {'
            echo "  access_log $PREFIX/logs/access.log;"
            echo "  client_body_temp_path $PREFIX/temp/client_body;"
            echo "  proxy_temp_path $PREFIX/temp/proxy;"
            echo "  fastcgi_temp_path $PREFIX/temp/fastcgi;"
            echo "  uwsgi_temp_path $PREFIX/temp/uwsgi;"
            echo "  scgi_temp_path $PREFIX/temp/scgi;"
            echo "  include $PREFIX/conf/mime.types;"
            # nginx -t opens every listening socket, and the package configuration binds the
            # privileged port 80, which an unprivileged runner cannot use. The port is
            # remapped for validation only, exactly as the acceptance harness does.
            sed 's/^    listen 80;/    listen 18080;/' deploy/nginx/xcloud.conf
            echo '}'
          } > "$PREFIX/conf/xcloud.conf"
          nginx -t -p "$PREFIX" -c "$PREFIX/conf/xcloud.conf"

      - name: Build frontend for the real Next.js production runtime proof
        working-directory: frontend
        run: npm run build

      - name: Deployment boundary acceptance
        run: node scripts/test-deployment-boundary.mjs

  local-development-edge:
    name: Local development edge integration
    runs-on: ubuntu-latest
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017
      MONGODB_XCLOUD_DB: xcloud
      MONGODB_APP_DB: xcloud_ops
      JWT_SECRET: ci-only-placeholder-secret-with-at-least-32-bytes
      INITIAL_ADMIN_PASSWORD: ChangeMe@2026
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Install dependencies
        run: |
          npm ci
          cd frontend && npm ci

      - name: Install Nginx
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx
          sudo systemctl stop nginx || true
          sudo pkill -x nginx || true
          echo "LOCAL_DEV_NGINX_BIN=$(command -v nginx)" >> "$GITHUB_ENV"
          nginx -v

      # Real MongoDB + real Go + real `next dev` + real Nginx. Proves the development
      # HTTP transport, the development HMR/WebSocket transport through the edge, the
      # `local:doctor` FULL_STACK_READY result and the EDGE_REQUIRED negative result.
      - name: Local development edge integration
        run: node scripts/test-local-development-edge.mjs

  local-operations-contract:
    name: Local development operations contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install repository script dependencies
        run: npm ci

      # Process-safety contract for the local runtime tooling: no arbitrary kill, foreign
      # listeners are detected and preserved, owned processes can be stopped, stale PID
      # records are safe and an identity mismatch is refused. Requires no MongoDB, Go or Nginx.
      - name: Local development operations contract
        run: node scripts/test-local-operations-contract.mjs

  repository-normalization:
    name: Repository normalization gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc

      - name: Current architecture documentation consistency
        run: node scripts/test-current-architecture-docs.mjs

      - name: Documentation integrity
        run: node scripts/test-documentation-integrity.mjs

      - name: Local access contract
        run: node scripts/test-local-access-contract.mjs

      - name: Repository normalization gate
        run: node scripts/test-repository-normalization.mjs

  production-architecture:
    name: Production architecture certification
    runs-on: ubuntu-latest
    needs:
      - node
      - go
      - direct-operations
      - user-management-e2e
      - authentication
      - deployment-boundary
      - local-development-edge
      - repository-normalization
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc

      - name: Record certification context
        run: |
          echo "production_architecture_certified_sha=$GITHUB_SHA"

      # The certification harness is pure source analysis; it needs no database
      # service, nginx or build step.
      - name: Production architecture certification
        run: node scripts/test-production-architecture.mjs

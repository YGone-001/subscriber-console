      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Install Chromium browser dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # Native-module integration: routes, navigation, shared primitives, shared
      # token system, observation/health separation and vendor-neutral strings.
      - name: Discovery UI/UX acceptance contract
        run: node scripts/test-nf-discovery-ui-contract.mjs

      # Browser-rendered acceptance: the built production SPA is served to real
      # Chromium against deterministic API fixtures. Captures the 19-PNG matrix,
      # verifies PNG integrity and SHA-256 checksums, asserts operator-observable
      # behaviour, and fails closed on browser errors or unexpected API requests.
      - name: Browser screenshot acceptance
        working-directory: frontend
        run: npm run acceptance:discovery-screenshots

      - name: Upload Discovery screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: discovery-ui-screenshots
          path: reports/ops/nf-discovery-screenshots
          if-no-files-found: error
          retention-days: 14

  production-architecture:
    name: Production architecture certification
    runs-on: ubuntu-latest
    needs:
      - frontend
      - ui-restoration
      - go-spa-hosting
      - go
      - direct-operations
      - user-management-e2e
      - authentication
      - deployment-boundary
      - local-development-runtime
      - local-operations-contract
      - repository-normalization
      - inventory-foundation
      - topology-foundation
      - topology-ui-acceptance
      - nf-discovery-integration
      - discovery-ui-acceptance
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc

      - name: Record certification context
        run: |
          echo "production_architecture_certified_sha=$GITHUB_SHA"

      # The certification harness is pure source analysis; it needs no database
      # service, nginx or build step.
      - name: Production architecture certification
        run: node scripts/test-production-architecture.mjs

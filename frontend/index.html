<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="xCloud operator console - subscriber, OCS, tariff and core network operations" />
    <!-- Kept in step with --background by the bootstrap script, then by ThemeProvider. -->
    <meta name="theme-color" content="#eef1f4" />
    <script>
      /*
       * Theme bootstrap. Resolves the operator's theme before the first paint, so a
       * dark-theme console never flashes light on load, and aligns the browser chrome with
       * it. ThemeProvider re-applies the same decision after mount and remains the runtime
       * source of truth; this script only settles the first frame.
       *
       * The two colour literals mirror --background in [data-theme="light"|"dark"]; they
       * apply to the first frame only, after which ThemeProvider reads the live token.
       */
      (function () {
        try {
          var preference = localStorage.getItem('XCLOUD_THEME_PREFERENCE') || 'system';
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = preference === 'dark' || (preference === 'system' && prefersDark) ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', theme);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#0e1216' : '#eef1f4');
        } catch (error) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/images/xCloud_picture.png" />
    <title>xCloud Operator Console</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
